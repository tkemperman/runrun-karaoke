<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ルンルンKARAOKE Settings</title><link rel="stylesheet" href="settings.css"></head>
<body><main>
<form id="repository-form">
<h2>Lyrics repositories · GitHub</h2>
<label for="repository-repo">Repository for search and publication (owner/repository or GitHub URL)</label><input id="repository-repo" placeholder="owner/karaoke-lyrics">
<label for="repository-branch">Branch</label><input id="repository-branch" value="main" required>
<label for="github-token">GitHub token</label>
<div class="key-row">
<input id="github-token" type="password" autocomplete="new-password">
<button id="clear-github-token" class="danger" type="button" hidden>Clear token</button>
</div>
<p>Public retrieval needs no token. Uploads use a fine-grained token with Contents: read and write for your selected repository. The token stays in local extension storage and is excluded from projects. Publish or delete translations using the buttons below.</p>
</form>
<p id="status" role="status"></p>
</main><script src="settings.js"></script></body></html>
